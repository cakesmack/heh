<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{ subject }}</title>
    <style type="text/css">
        /* CLIENT-SPECIFIC RESETS */
        body,
        table,
        td,
        a {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        table,
        td {
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }

        img {
            -ms-interpolation-mode: bicubic;
            border: 0;
            height: auto;
            line-height: 100%;
            outline: none;
            text-decoration: none;
        }

        table {
            border-collapse: collapse !important;
        }

        body {
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
        }

        /* iOS BLUE LINK REMOVAL */
        a[x-apple-data-detectors] {
            color: inherit !important;
            text-decoration: none !important;
            font-size: inherit !important;
            font-family: inherit !important;
            font-weight: inherit !important;
            line-height: inherit !important;
        }

        /* MOBILE STYLES */
        @media screen and (max-width: 600px) {
            .mobile-padding {
                padding: 20px 15px !important;
            }

            .mobile-header-padding {
                padding: 15px !important;
            }

            h1 {
                font-size: 24px !important;
                line-height: 1.3 !important;
            }
        }
    </style>
</head>

<body style="margin: 0; padding: 0; background-color: #f4f4f4;">

    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f4f4f4;">
        <tr>
            <td align="center" style="padding: 20px 0;">
                <table border="0" cellpadding="0" cellspacing="0" width="100%"
                    style="max-width: 600px; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">

                    <tr>
                        <td align="left" bgcolor="#0f3d2e" style="padding: 20px 30px; background-color: #0f3d2e;"
                            class="mobile-header-padding">
                            <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td width="40" style="padding-right: 15px;" valign="middle">
                                        <img src="https://imagedelivery.net/bo62dvlU2o27fRAdUvzFdA/68a3e2ca-d17b-4697-91a3-9a40f6be8500/card"
                                            alt="Highland Events Hub Logo" width="40" height="auto"
                                            style="display: block; color: #ffffff; font-family: sans-serif;">
                                    </td>
                                    <td style="color: #ffffff; font-family: Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; letter-spacing: 0.5px;"
                                        valign="middle">
                                        Highland Events Hub
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 40px 30px;" class="mobile-padding">
                            {{ body }}
                        </td>
                    </tr>
                    <tr>
                        <td bgcolor="#fcfcfc" style="padding: 30px; border-top: 1px solid #eeeeee;"
                            class="mobile-padding">
                            <p
                                style="margin: 0 0 10px 0; color: #999999; font-family: Helvetica, Arial, sans-serif; font-size: 12px; line-height: 1.5; text-align: center;">
                                © 2026 Highland Events Hub. All rights reserved.
                            </p>
                            <p
                                style="margin: 0; color: #999999; font-family: Helvetica, Arial, sans-serif; font-size: 12px; line-height: 1.5; text-align: center;">
                                You received this email because you signed up on our website.<br>
                                <a href="{{ unsubscribe_url }}"
                                    style="color: #999999; text-decoration: underline;">Unsubscribe from future
                                    emails</a>
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>

</html>
