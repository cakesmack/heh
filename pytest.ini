[pytest]
testpaths = backend/tests
python_files = test_*.py
norecursedirs =
    .git
    .pytest_cache
    __pycache__
    .venv
    venv
    .next
    build
    dist
    generated
    site-packages
    node_modules
    frontend
    scripts-node
    scratch
    archive
    _archive
addopts = --strict-markers
asyncio_mode = strict
required_plugins = pytest-asyncio
markers =
    asyncio: run an asynchronous test with pytest-asyncio
